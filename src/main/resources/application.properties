spring.application.name=smart-asset-test

# Serialize LocalDateTime / Instant as ISO-8601 strings, not epoch numbers
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Trading calendar ──────────────────────────────────────────────────────────
# The calendar date used to anchor all 96 quarter start times (ISO-8601).
smart-asset.trading-date=2025-01-01

# ── EV Charging groups ────────────────────────────────────────────────────────
